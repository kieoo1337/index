<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subdomain Takeover K!E00 </title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #00ff66;
      font-family: "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,255,100,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,100,.04) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
    }

    .container {
      width: min(900px, 90%);
      text-align: center;
      border: 1px solid #00ff66;
      padding: 50px 30px;
      box-shadow:
        0 0 15px #00ff66,
        inset 0 0 30px rgba(0,255,100,.05);
      background: rgba(0, 15, 5, .92);
      position: relative;
    }

    .tag {
      color: #777;
      font-size: 13px;
      margin-bottom: 25px;
      letter-spacing: 3px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 90px);
      text-transform: uppercase;
      text-shadow:
        0 0 5px #00ff66,
        0 0 20px #00ff66;
      animation: glitch 1.5s infinite;
    }

    .name {
      margin-top: 15px;
      font-size: clamp(25px, 5vw, 50px);
      color: #fff;
      text-shadow: 0 0 15px #fff;
    }

    .terminal {
      margin: 35px auto;
      max-width: 650px;
      text-align: left;
      padding: 20px;
      border-left: 3px solid #00ff66;
      background: #020702;
      color: #00ff66;
      line-height: 1.8;
    }

    .red {
      color: #ff3030;
    }

    .white {
      color: #ddd;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background: #00ff66;
      animation: blink .8s infinite;
      vertical-align: middle;
    }

    .footer {
      margin-top: 25px;
      color: #555;
      font-size: 12px;
      letter-spacing: 2px;
    }

    @keyframes blink {
      50% { opacity: 0; }
